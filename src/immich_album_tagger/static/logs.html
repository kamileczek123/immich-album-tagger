<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="logs.title">Operation log</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <script src="static/theme.js"></script>
  <link rel="stylesheet" href="immich-theme.css">
  <link rel="stylesheet" href="static/style.css">
</head>
<body class="shell">
  <nav class="topbar">
    <a class="brand" href="./">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 5h11.5L28 16.5 16.5 28 5 16.5z"/><circle cx="11" cy="11" r="2.6"/></svg>
      <span class="brand-text"><span class="brand-immich">Immich</span> Album Tagger</span>
    </a>
    <span class="search-space"></span>
    <div class="top-actions">
      <button id="theme" type="button" class="icon-btn" data-i18n-title="nav.theme" data-i18n-aria="nav.theme"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button>
      <div class="account">
        <button id="account" type="button" class="avatar" aria-haspopup="true" aria-expanded="false" data-i18n-aria="nav.account">?</button>
        <div id="account-menu" class="menu" hidden>
          <p id="who" class="menu-who"></p>
          <p class="menu-version"><span data-i18n="app.version">Immich Album Tagger version</span> <span id="version"></span></p>
          <button id="logout" type="button" class="menu-item" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg><span data-i18n="nav.logout">Log out</span></button>
        </div>
      </div>
    </div>
  </nav>

  <aside class="sidebar">
    <a href="./" class="side-link"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg><span data-i18n="nav.albums">Albums</span></a>
    <a href="logs" class="side-link" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span data-i18n="nav.logs">Logs</span></a>
    <a href="../" id="to-immich" class="side-link" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg><span data-i18n="nav.immich">Open Immich</span></a>
    <div class="side-foot">
      <p class="disclaimer" data-i18n="app.disclaimer">Not affiliated with or endorsed by Immich or FUTO. Immich is a trademark of FUTO.</p>
    </div>
  </aside>

  <main class="content">
    <header class="page-head">
      <h1 data-i18n="logs.title">Operation log</h1>
      <p id="count" class="count"></p>
    </header>
    <div class="toolbar">
      <div class="seg" role="group" data-i18n-aria="list.show">
        <button type="button" data-filter="all" aria-pressed="true" data-i18n="logs.all">All</button>
        <button type="button" data-filter="error" aria-pressed="false" data-i18n="logs.errors">Errors</button>
        <button type="button" data-filter="success" aria-pressed="false" data-i18n="logs.successes">Successes</button>
      </div>
      <label id="person-box" class="person-filter" hidden>
        <span data-i18n="logs.person">Person</span>
        <select id="person">
          <option value="" data-i18n="logs.everyone">Everyone</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="reload" type="button" class="btn ghost" data-i18n="logs.reload">Refresh</button>
      <button id="clear" type="button" class="danger-btn" data-i18n="logs.clear">Clear log</button>
    </div>
    <ol id="entries" class="log"></ol>
    <p id="empty" class="empty" hidden data-i18n="logs.empty"></p>
  </main>
  <script src="static/logs.js" type="module"></script>
</body>
</html>
