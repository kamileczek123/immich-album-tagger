# Gitea side of the release: tests on every push, image in this Gitea's own container
# registry for every X.Y.Z tag. Nothing here is specific to one server: the registry and the
# image name come from the instance and repository the workflow runs in. GitHub ignores
# this directory (its workflow is .github/workflows/dockerhub.yml).
#
# Secret: IMMICH_ALBUM_TAGGER_TOKEN - a Gitea access token with package write permission.

name: Build and Publish Immich Album Tagger

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: semver
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Tag: '$VERSION'"
          if [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Invalid tag format '$VERSION'. Only numeric tags (e.g., 0.0.1) are allowed. Tags with 'v' are forbidden."
            exit 1
          fi

      # The app reports the version from pyproject.toml (UI, /api/health, --version).
      # Refuse to publish an image whose tag says something else.
      - name: Check tag matches pyproject.toml version
        run: |
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "pyproject.toml: '$PROJECT_VERSION', tag: '${{ steps.semver.outputs.version }}'"
          if [[ "$PROJECT_VERSION" != "${{ steps.semver.outputs.version }}" ]]; then
            echo "ERROR: tag ${{ steps.semver.outputs.version }} does not match version $PROJECT_VERSION in pyproject.toml. Bump pyproject.toml, commit, then tag."
            exit 1
          fi

      # e.g. https://git.example.com + owner/repo -> git.example.com/owner/repo
      - name: Registry and image name of this Gitea
        id: image
        run: |
          REGISTRY="${GITHUB_SERVER_URL#*://}"
          REGISTRY="${REGISTRY%/}"
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "name=$REGISTRY/$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "Image: $REGISTRY/$REPOSITORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.IMMICH_ALBUM_TAGGER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.semver.outputs.version }}
